[project]
name = "openneuro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip @ git+https://github.com/openai/CLIP.git",
    "fastapi>=0.115.0",
    "litellm>=1.81.8",
    "mypy>=1.19.1",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.1",
    "openai>=2.17.0",
    "cv2-enumerate-cameras>=1.1.10",
    "opencv-python-headless>=4.13.0.92",
    "openvr-virtual-driver-client>=0.0.9",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.1",
    "smplx",
    "sounddevice>=0.5.5",
    "sse-starlette>=3.2.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=5.1.0",
    "types-requests>=2.32.4.20260107",
    "uvicorn[standard]>=0.30.0",
    "websockets>=16.0",
    "py-cord",
    "py-cord[voice]",
    "pyyaml>=6.0",
    "tyro>=0.9.0",
    "python-osc>=1.9.3",
    "mem0ai",
    "depth-anything-3 @ git+https://github.com/MarksonChen/Depth-Anything-3.git",
    "librosa>=0.10.0",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["sounddevice", "onnxruntime", "clip", "smplx", "yaml", "tqdm", "tqdm.*", "depth_anything_3", "depth_anything_3.*", "librosa"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.core.conduit.qwen_tts.tts_model.*"]
ignore_errors = true


[tool.ruff]
extend-exclude = ["src/core/conduit/qwen_tts/tts_model"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# DA3 lists open3d but never imports it; open3d lacks 3.13+ wheels
override-dependencies = ["open3d ; python_version < '0'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
