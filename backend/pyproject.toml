[project]
name = "openneuro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip @ git+https://github.com/openai/CLIP.git",
    "fastapi>=0.115.0",
    "litellm>=1.81.8",
    "mypy>=1.19.1",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.1",
    "openai>=2.17.0",
    "opencv-python-headless>=4.13.0.92",
    "openvr-virtual-driver-client>=0.0.8",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.1",
    "smplx",
    "sounddevice>=0.5.5",
    "sse-starlette>=3.2.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=5.1.0",
    "types-requests>=2.32.4.20260107",
    "uvicorn[standard]>=0.30.0",
    "websockets>=16.0",
    "py-cord",
    "py-cord[voice]",
    "pyyaml>=6.0",
    "tyro>=0.9.0",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["sounddevice", "onnxruntime", "clip", "smplx"]
ignore_missing_imports = true


[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
