name: Typecheck and Lint

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_CACHE_DIR: /home/runner/.cache/uv
      CUDA_VISIBLE_DEVICES: ""
      PYTORCH_TEST_WITHOUT_CUDA: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/uv
            backend/.venv
          key: typecheck-lint-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            typecheck-lint-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: uv sync --group dev --no-default-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .
